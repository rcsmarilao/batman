<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>SHEETBASE · Gate</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;}[hidden]{display:none!important;}::selection{background:#0d5c33;color:#fff;}
html,body{height:100%;}body{font-family:'Inter',system-ui,sans-serif;background:#0B1220;color:#fff;overflow:hidden;}
.stage{position:fixed;inset:0;background:#0B1220;overflow:hidden;}
.camera{position:absolute;inset:0;}.camera #qr-reader{width:100%;height:100%;}
#qr-reader__scan_region{height:100%;}#qr-reader__scan_region video{width:100%!important;height:100%!important;object-fit:cover;}
#qr-reader__dashboard_section,#qr-reader__status_span{display:none!important;}
.scanline{position:absolute;left:50%;transform:translateX(-50%);width:68vmin;height:2px;background:#3ddc84;box-shadow:0 0 14px #3ddc84;opacity:0;z-index:6;pointer-events:none;animation:gkscan 2.2s ease-in-out infinite;}
.camera.scanning .scanline{opacity:.9;}
@keyframes gkscan{0%,100%{top:calc(50% - 33vmin);}50%{top:calc(50% + 33vmin);}}
.idle{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#94A3B8;z-index:10;background:radial-gradient(circle at 50% 40%,#12203a 0%,#0B1220 70%);text-align:center;padding:20px;}
.proc{position:absolute;inset:0;background:rgba(11,18,32,.75);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:25;font-size:16px;font-weight:600;gap:12px;}.proc.active{display:flex;}
.spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;}@keyframes spin{to{transform:rotate(360deg);}}
.hud-top{position:absolute;top:0;left:0;right:0;padding:calc(14px + env(safe-area-inset-top)) 16px 20px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(to bottom,rgba(5,10,20,.85),transparent);z-index:15;}
.floor-badge{display:flex;align-items:baseline;gap:8px;background:rgba(255,255,255,.14);backdrop-filter:blur(8px);padding:8px 16px;border-radius:99px;border:1px solid rgba(255,255,255,.15);}
.floor-num{font-size:22px;font-weight:800;line-height:1;}.floor-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;opacity:.85;}
.hud-actions{display:flex;gap:10px;}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.14);color:#fff;font-size:17px;cursor:pointer;backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;transition:.15s;}.icon-btn:active{transform:scale(.94);}
.verdict{position:absolute;top:50%;left:50%;transform:translate(-50%,-42%) scale(.92);width:min(92%,440px);padding:30px 24px;border-radius:24px;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:20;box-shadow:0 20px 50px rgba(0,0,0,.4);}
.verdict.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
.verdict.in{background:linear-gradient(135deg,#059669,#047857);}.verdict.out{background:linear-gradient(135deg,#DC2626,#B91C1C);}.verdict.dup{background:linear-gradient(135deg,#D97706,#B45309);}.verdict.err{background:linear-gradient(135deg,#475569,#334155);}
.v-dir{font-size:20px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;opacity:.95;}
.v-name{font-size:40px;font-weight:800;line-height:1.1;margin:10px 0 6px;letter-spacing:-.02em;}
.v-time{font-size:14px;font-weight:500;opacity:.9;}
.manual{position:absolute;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:rgba(8,13,25,.95);backdrop-filter:blur(10px);display:flex;gap:10px;align-items:center;transform:translateY(100%);transition:transform .25s;z-index:30;border-top:1px solid rgba(255,255,255,.1);}.manual.open{transform:translateY(0);}
.manual input{flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#fff;padding:12px 14px;border-radius:8px;font-size:15px;}.manual input::placeholder{color:rgba(255,255,255,.4);}
.btn{display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;padding:12px 18px;border-radius:8px;border:none;cursor:pointer;background:#0d5c33;color:#fff;transition:.15s;}.btn:hover{background:#0a4728;}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);z-index:120;opacity:0;background:#1e293b;color:#fff;font-size:14px;font-weight:500;padding:12px 24px;border-radius:8px;transition:.2s;pointer-events:none;}.toast.show{opacity:1;transform:translate(-50%,0);}.toast.err{background:#DC2626;}
.loading-screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#0B1220;z-index:200;color:#94A3B8;}
</style>
</head>
<body>

<div class="loading-screen" id="loadingScreen">
  <div class="spinner"></div>
  <div style="font-size:14px;font-weight:500;">Connecting to gate…</div>
</div>

<div class="stage" id="stage" hidden>
  <div class="camera" id="camWrap">
    <div id="qr-reader"></div><div class="scanline"></div>
    <div class="idle" id="camIdle">
      <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
      <div style="font-size:17px;font-weight:700;color:#E2E8F0;">Camera Offline</div>
      <button class="btn" id="startBtn">▶ Start Camera</button>
    </div>
    <div class="proc" id="proc"><div class="spinner"></div><div>Processing…</div></div>
  </div>
  <div class="hud-top">
    <div class="floor-badge"><span class="floor-num" id="floorNum">0</span><span class="floor-label">on floor</span></div>
    <div class="hud-actions">
      <button class="icon-btn" id="manualBtn" title="Manual entry">⌨</button>
      <button class="icon-btn" id="stopBtn" title="Stop camera">■</button>
    </div>
  </div>
  <div class="verdict" id="verdict"><div class="v-dir" id="vDir">READY</div><div class="v-name" id="vName">Awaiting scan</div><div class="v-time" id="vTime"></div></div>
  <form class="manual" id="manualForm"><input id="manualIn" placeholder="Enter badge code…" autocomplete="off"><button type="submit" class="btn">Log</button><button type="button" class="icon-btn" id="manualClose">✕</button></form>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  // ═══════════════════════════════════════════════
  // CONFIG — replace with your gatekeeper account
  // ═══════════════════════════════════════════════
  const API       = "https://script.google.com/macros/s/AKfycbw0q5r3A6JlI-t-84bzwJKwo4yjz7gsEideQZJdCGF5Zxb8977tfjVWllPaMoEN0Ba3/exec";
  const GATE_USER = "1234";       // ← your gatekeeper username
  const GATE_PASS = "1234"; // ← your gatekeeper password

  const LS_SESS='gate.session', LS_DEV='gate.device';
  const $=s=>document.querySelector(s);
  const lsGet=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
  const lsSet=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};
  let deviceId=lsGet(LS_DEV)||crypto.randomUUID(); lsSet(LS_DEV,deviceId);
  let sess=null; try{sess=JSON.parse(lsGet(LS_SESS)||'null');}catch(e){}
  let toastTimer;
  function toast(msg,type){ const t=$('#toast'); t.textContent=msg; t.className='toast show'+(type==='err'?' err':''); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.className='toast',2500); }

  async function parse_(resp){ const text=await resp.text(); try{return JSON.parse(text);}catch(e){ throw new Error('Server error'); } }
  const sessionValid=()=>!!(sess&&sess.token&&Date.now()<sess.exp);
  async function post(o){ try{ return await fetch(API,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...o,token:sessionValid()?sess.token:''})}).then(parse_); }catch(e){ return {ok:false,error:'net'}; } }
  async function getFloor(){ try{ return await fetch(API+'?action=floor&token='+(sessionValid()?encodeURIComponent(sess.token):''),{redirect:'follow'}).then(parse_); }catch(e){ return {ok:false,error:'net'}; } }
  async function authRaw(u,p){ try{ return await fetch(API,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'auth',username:u,password:p,device:deviceId})}).then(parse_); }catch(e){ return {ok:false,error:'net'}; } }
  function applySession(r){ sess={token:r.token,exp:Date.now()+r.ttl*1000,user:r.user}; lsSet(LS_SESS,JSON.stringify(sess)); }

  // Auto-login with embedded gatekeeper credentials
  async function autoLogin(){
    // Try existing session first
    if(sessionValid()) return true;
    // Otherwise authenticate
    const r = await authRaw(GATE_USER, GATE_PASS);
    if(r.ok && r.user.role === 'GATEKEEPER'){ applySession(r); return true; }
    return false;
  }

  // Scanner
  let scanner=null, scanning=false, processing=false, wakeLock=null;
  async function acquireWakeLock(){ try{ if('wakeLock' in navigator) wakeLock=await navigator.wakeLock.request('screen'); }catch(e){} }
  function releaseWakeLock(){ try{ if(wakeLock){wakeLock.release();wakeLock=null;} }catch(e){} }
  async function startCamera(){
    if(scanning||!window.isSecureContext) return;
    try{
      scanner=scanner||new Html5Qrcode('qr-reader');
      await scanner.start({facingMode:'environment'},{fps:15,qrbox:(vw,vh)=>{const m=Math.min(vw,vh);const s=Math.floor(m*0.72);return{width:s,height:s};}}, async t=>{
        if(processing) return; processing=true; $('#proc').classList.add('active');
        try{ await processScan(t); }catch(e){} finally{ $('#proc').classList.remove('active'); setTimeout(()=>processing=false,400); }
      },()=>{});
      scanning=true; $('#camWrap').classList.add('scanning'); $('#camIdle').hidden=true; acquireWakeLock();
    }catch(e){ toast('Camera error','err'); }
  }
  function stopCamera(){ if(!scanning) return; try{scanner.stop().then(()=>scanner.clear());}catch(e){} scanning=false; $('#camWrap').classList.remove('scanning'); $('#camIdle').hidden=false; releaseWakeLock(); }
  $('#startBtn').addEventListener('click',startCamera);
  $('#stopBtn').addEventListener('click',stopCamera);

  async function processScan(qr){
    const v=$('#verdict'); v.className='verdict';
    const r=await post({action:'scan',qr});
    if(r.ok){ v.classList.add(r.dir==='IN'?'in':'out'); $('#vDir').textContent=r.dir==='IN'?'✓ ENTRY':'← EXIT'; $('#vName').textContent=r.name; $('#vTime').textContent=r.time+' · '+r.dept; loadFloor(); }
    else if(r.error==='duplicate'){ v.classList.add('dup'); $('#vDir').textContent='⚠ DUPLICATE'; $('#vName').textContent=r.name; $('#vTime').textContent='Already scanned at '+r.time; }
    else if(r.error==='inactive'){ v.classList.add('err'); $('#vDir').textContent='INACTIVE'; $('#vName').textContent=r.name; $('#vTime').textContent='Badge deactivated'; }
    else { v.classList.add('err'); $('#vDir').textContent='✕ UNKNOWN'; $('#vName').textContent='Not recognized'; $('#vTime').textContent=''; }
    v.classList.add('show'); clearTimeout(v._t); v._t=setTimeout(()=>v.classList.remove('show'),3000);
  }

  $('#manualBtn').addEventListener('click',()=>{$('#manualForm').classList.toggle('open'); if($('#manualForm').classList.contains('open')) setTimeout(()=>$('#manualIn').focus(),250);});
  $('#manualClose').addEventListener('click',()=>$('#manualForm').classList.remove('open'));
  $('#manualForm').addEventListener('submit',async e=>{ e.preventDefault(); const v=$('#manualIn').value.trim(); if(!v) return; $('#manualForm').classList.remove('open'); $('#manualIn').value=''; $('#proc').classList.add('active'); try{ await processScan(v); }catch(err){} finally{ $('#proc').classList.remove('active'); } });

  async function loadFloor(){ const r=await getFloor(); if(r.ok) $('#floorNum').textContent=r.onFloor; }
  setInterval(loadFloor,10000);

  // Boot: auto-login then show scanner
  async function init(){
    const ok = await autoLogin();
    $('#loadingScreen').hidden = true;
    if(ok){
      $('#stage').hidden = false;
      startCamera();
      loadFloor();
    } else {
      // Show a minimal error if auto-login fails
      document.body.innerHTML = '<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0B1220;color:#fff;font-family:Inter,sans-serif;text-align:center;padding:20px;"><div><div style="font-size:24px;margin-bottom:12px;">⚠ Gate Unavailable</div><div style="color:#94A3B8;">Could not connect. Check your credentials in the code.</div></div></div>';
    }
  }
  init();
})();
</script>
</body>
</html>
